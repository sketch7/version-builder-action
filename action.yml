name: "Version Builder"
description: "Generates/modifies version number based on version, branch and settings."
author: "Stephen Lautier"

# Add your action's branding here. This will appear on the GitHub Marketplace.
branding:
  icon: "heart"
  color: "red"

# Define your inputs here.
inputs:
  version:
    required: false
    description: "Version to be used, if not specified will read from `package.json`."
    # default: "default value if applicable"
  package-json-dir:
    required: false
    description: "Directory containing `package.json`, for monorepo sub-packages
      e.g. 'apps/client'. Leading/trailing slashes are stripped.
      Defaults to the repository root."
    default: ""
  force-preid:
    required: false
    description: "Forces preid versioning even if branch not satisfied."
    default: "false"
  force-stable:
    required: false
    description: "Forces non-preid versioning even if branch not satisfied."
    default: "false"
  preid-branches:
    required: false
    description: "Branches to use for preid versioning, as a comma-delimited list. Each
      entry can be either a plain branch name (uses the global `preid` value) or
      `branch:preid` to map a specific preid per branch e.g.
      'main:rc,master:rc,develop:dev,vnext:next'."
    default: "main:rc,master:rc,develop:dev,vnext:next"
  stable-branches:
    required: false
    description: "Regex patterns (comma-delimited) matching stable branches that should
      never receive a preid. Any branch not in `preid-branches` and not matching
      one of these patterns will fall back to the default `preid`.
      e.g. '^v\\d+$,^\\d+\\.x$' matches 'v1', 'v2', '1.x', '2.x'."
    default: '^v\d+$,^\d+\.x$'
  preid:
    required: false
    description: "Version preid to append e.g. 'dev', if not specified will read from
      `package.json` or generated via branch name. The completed prerelease suffix
      must be valid SemVer."
    # default: "default value if applicable"
  preid-template:
    required: false
    description: "Template for the resolved prerelease identifier. Supports `{preid}` and
      `{branch}`; `{branch}` is a normalized branch slug."
    default: "{preid}"
  preid-num-delimiter:
    required: false
    description: "Delimiter for build number to use when using preid e.g. preid 'dev' with       `.` delimiter be '1.0.0-dev.123' ('dev.123')."
    default: "."
  counter-base-ref:
    required: false
    description: "Optional git ref used to count prerelease commits since its merge base with
      HEAD. When empty, counts commits since the last package.json version change."
    default: ""
  tag-tmpl:
    required: false
    description: "Tag template for latest-major selection and version conflicts. Uses local tags
      by default and live GitHub tags with preflight. Use `{major}` as placeholder
      e.g. 'v{major}' matches tag 'v1.5.6'. Preflight requires exactly one marker
      and validates the generated exact and floating Git refs."
    default: "v{major}"
  on-version-conflict:
    required: false
    description: "Behavior when a stable (non-preid) version's git tag already exists:
      'ignore' (default, no local conflict check), 'fail', or 'bump-patch'
      (auto-increments the patch until a free tag is found).
      Preflight validates the final release even with 'ignore' and recovers unfinished
      same-commit tags before applying this policy."
    default: "ignore"
  release-preflight:
    required: false
    description: "When true, use live GitHub release state to validate the resolved version
      before it is emitted. Requires github-token with contents: write so draft releases are
      visible. Completed releases fail before publication; unfinished same-commit tags can
      be recovered. Default-branch pushes that only bump package.json to the next minor
      (and matching npm lockfile root versions) return skip-publish without a version.
      Requires full checkout history. Explicit version inputs bypass bump detection.
      The action never mutates GitHub releases."
    default: "false"
  github-token:
    required: false
    description: "GitHub token used only when release-preflight is true. The workflow needs
      contents: write permission so paginated release listings include drafts. The action only
      reads GitHub state and never mutates releases."

# Define your outputs here.
outputs:
  skip-publish:
    description: "True for a version-only next-minor bump with release-preflight enabled.
      No version outputs are emitted; callers must skip publication and release follow-ups."
  version:
    description: "Build version generated e.g. '1.5.6-dev.123'. Patch is bumped when
      on-version-conflict: bump-patch resolved a tag collision."
  baseVersion:
    description: "Base version without preid e.g. '1.5.6'."
  fileVersion:
    description: "4-part numeric version for non-semver consumers (e.g. .NET assembly version): '1.5.6.5' on pre-release, '1.5.6' on stable."
  majorVersion:
    description: "Returns the major version e.g. '1'"
  minorVersion:
    description: "Returns the minor version e.g. '5'"
  patchVersion:
    description: "Returns the patch version e.g. '6'"
  preid:
    description: "Returns the preid e.g. 'dev' based on preid, when isPrerelease else empty string."
  preidCounter:
    description: "Returns the preid counter number e.g. '2' for '-rc.2', when isPrerelease else empty string."
  branchSlug:
    description: "Returns the normalized branch slug used by `{branch}` in preid-template, or an empty string when the template does not use `{branch}`."
  isPrerelease:
    description: "Returns whether the version is a prerelease version e.g. 'true' or
      'false'."
  isLatest:
    description: "Returns whether a stable version belongs to the highest major parsed from tags
      matching tag-tmpl e.g. 'true' or 'false'. Default mode uses local tags; release-preflight
      uses live GitHub tags. Always 'false' for prereleases."
  tag:
    description: "Returns the dist-tag for the build e.g. formatted preid, 'latest', or 'v1-lts'.
      Stable-major selection uses local tags by default and live GitHub tags with release-preflight."
  exactTag:
    description: "Validated exact Git tag for the resolved version when release-preflight is enabled and a version is emitted."
  floatingTag:
    description: "Validated floating major Git tag when release-preflight is enabled and a version is emitted."

runs:
  using: "node24"
  main: "dist/index.mjs"
